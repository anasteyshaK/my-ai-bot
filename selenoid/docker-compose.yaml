
services:
  gradio:
    build:
      context: ..
      dockerfile: selenoid/Dockerfile.gradio
    container_name: my-ai-gradio
    ports:
      - "127.0.0.1:7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/')"]
      interval: 5s
      timeout: 3s
      retries: 12

  selenoid:
    image: aerokube/selenoid:1.11.3
    container_name: my-ai-selenoid
    ports:
      - "127.0.0.1:4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/selenoid/browsers.json:ro
    command:
      - "-conf"
      - "/etc/selenoid/browsers.json"
      - "-limit"
      - "2"
      - "-container-network"
      - "selenoid_default"
    restart: unless-stopped
