
name: Selenium E2E Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-tests:
    name: Test Gradio UI
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Python
        run: |
          python --version
          python -m pip --version


      - name: Install dependencies
        run: |
          python -m pip install pytest selenium requests

      - name: Start Gradio and Selenoid
        run: |
          docker pull selenoid/chrome:128.0
          docker compose -f selenoid/docker-compose.yaml up -d --build

      - name: Wait for Gradio and Selenoid
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:7860/ >/dev/null && curl --fail --silent http://localhost:4444/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f selenoid/docker-compose.yaml logs
          exit 1

      - name: Run Selenium tests
        env:
          SELENOID_URL: http://localhost:4444/wd/hub
          GRADIO_URL: http://gradio:7860
        run: python -m pytest tests/seleniumtest.py::test_open_gradio_app -v

      - name: Stop containers
        if: always()
        run: docker compose -f selenoid/docker-compose.yaml down --volumes
